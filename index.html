<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nageshwari Agro — Random Idea Generator</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:0 auto;padding:60px 20px}.hero{background:#fff;border-radius:20px;padding:40px;box-shadow:0 10px 30px #17203318;text-align:center}button{border:0;border-radius:12px;padding:15px 22px;font-weight:700;cursor:pointer;background:#174d2a;color:#fff;font-size:16px}.result{margin-top:28px;padding:25px;border:1px solid #dde3ee;border-radius:16px;text-align:left}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#e9eef8;margin-bottom:14px;font-size:13px}.muted{color:#61708a}</style></head><body><div class="wrap"><div class="hero"><div class="pill">NAGESHWARI AGRO • LIVE DEMO</div><h1>Random Idea Generator</h1><p class="muted">Click the button and get a random business or project idea.</p><button id="go">Generate Random Idea</button><div class="result" id="result"><h2>Ready?</h2><p class="muted">Your random idea will appear here.</p></div></div></div><script>const ideas=[['Agro Delivery App','Business','Build a local farm-to-home ordering service for fresh vegetables.','Easy'],['Smart Inventory Tracker','Software','Create a dashboard that predicts when stock needs reordering.','Medium'],['Local Vendor Marketplace','Business','Connect restaurants with trusted local produce suppliers.','Medium'],['AI Menu Assistant','AI','Generate menu suggestions from available ingredients and customer preferences.','Hard'],['Farm Price Alert','AgriTech','Send daily alerts when key vegetable prices cross a chosen threshold.','Medium'],['Order Consolidator','Productivity','Combine orders from multiple outlets into one clean purchasing list.','Easy']];document.getElementById('go').onclick=()=>{const x=ideas[Math.floor(Math.random()*ideas.length)];document.getElementById('result').innerHTML='<div class="pill">'+x[1]+' • '+x[3]+'</div><h2>'+x[0]+'</h2><p>'+x[2]+'</p>'};</script></body></html>
